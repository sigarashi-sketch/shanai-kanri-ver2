<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>色の見本（本番前）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
/* 「色がチープ」への見本。同じ残業の表を3通りで塗る。
   安っぽさの元：ベタ塗りのパステル札・彩度の高いオレンジ/緑の棒・白い平らなカード。
   直し方：彩度を落とす・色は面でなく点と細線で・面は1段暗い中間色・影を重ねる */
* { box-sizing: border-box }
body { margin: 0; font-family: Inter, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; background: #E9EAEE; color: #171717; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 24px 16px 60px; display: flex; flex-direction: column; gap: 28px; }
h1 { margin: 0; font-size: 22px } .lead { color: #5A5E75; font-size: 13.5px; margin-top: 4px }
.opt { border-radius: 18px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 32px rgba(15,20,38,.10) }
.opt > header { display: flex; align-items: baseline; gap: 12px; padding: 14px 20px; font-size: 13px }
.opt > header b { font-size: 16px }
.app { display: grid; grid-template-columns: 200px 1fr; min-height: 420px }
.side { padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px }
.side .g { margin: 10px 8px 4px; font-weight: 700; display: flex; align-items: center; gap: 8px; font-size: 12px }
.side .g i { width: 8px; height: 8px; border-radius: 3px }
.side a { padding: 7px 10px; border-radius: 8px; color: inherit; text-decoration: none; opacity: .78 }
.side a.on { opacity: 1; font-weight: 700 }
.main { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px }
.title { font-size: 20px; font-weight: 700; letter-spacing: -.01em }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px }
.kpi { border-radius: 12px; padding: 12px 14px } .kpi small { display: block; font-size: 11.5px } .kpi b { font-size: 22px; font-variant-numeric: tabular-nums }
table { width: 100%; border-collapse: collapse; font-size: 13px; border-radius: 12px; overflow: hidden }
th { text-align: left; font-weight: 600; padding: 10px 12px; font-size: 12px } td { padding: 11px 12px; vertical-align: middle }
.bar { position: relative; width: 150px; height: 8px; border-radius: 99px; display: inline-block; vertical-align: middle; margin-right: 10px }
.bar span { position: absolute; inset: 0 auto 0 0; border-radius: 99px }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; border-radius: 99px; padding: 3px 9px; white-space: nowrap }
.btn { border-radius: 9px; padding: 7px 12px; font-size: 12.5px; font-weight: 700; border: 1px solid; background: none; font-family: inherit }

/* ===== 1：墨と金（落ち着いた高級感） ===== */
.o1 { background: #FBFAF7 }
.o1 > header { background: #0F1426; color: #E9E2D0 } .o1 > header b { color: #fff }
.o1 .side { background: linear-gradient(180deg, #121830, #0B1020); color: #CFC8B6 }
.o1 .side a.on { background: rgba(200,169,110,.14); color: #F3E7C9; box-shadow: inset 2px 0 0 #C8A96E }
.o1 .side .g i { background: #C8A96E }
.o1 .title { color: #0F1426 }
.o1 .kpi { background: #fff; border: 1px solid #ECE7DC; box-shadow: 0 1px 0 rgba(15,20,38,.03) } .o1 .kpi small { color: #8A8372 }
.o1 table { background: #fff; border: 1px solid #ECE7DC } .o1 th { background: #F5F1E8; color: #5C5340 } .o1 td { border-top: 1px solid #F2EEE6 }
.o1 .bar { background: #F0ECE3 } .o1 .bar span { background: linear-gradient(90deg, #A88A57, #C8A96E) } .o1 .bar span.hi { background: linear-gradient(90deg, #8E3B46, #B5525E) }
.o1 .chip { background: none; border: 1px solid currentColor; font-weight: 600 }
.o1 .c-d { color: #9B2C3C } .o1 .c-w { color: #9A6416 } .o1 .c-c { color: #7C6A2E } .o1 .c-ok { color: #3E6B52 }
.o1 .btn { color: #0F1426; border-color: #D8CDB4 }

/* ===== 2：深い宝石色（分類色を残して深く） ===== */
.o2 { background: #F4F5F9 }
.o2 > header { background: linear-gradient(90deg, #0B3B37, #0F5E57); color: #CDE7E2 } .o2 > header b { color: #fff }
.o2 .side { background: #10131F; color: #B9BED3 }
.o2 .side a.on { background: linear-gradient(90deg, rgba(20,145,130,.28), rgba(20,145,130,.06)); color: #fff }
.o2 .side .g i { background: #14A08F; box-shadow: 0 0 0 3px rgba(20,160,143,.18) }
.o2 .title { color: #0B2F2C }
.o2 .kpi { background: #fff; border: 1px solid #E3E6EE; box-shadow: 0 1px 2px rgba(16,19,31,.04), 0 6px 16px rgba(16,19,31,.05) }
.o2 .kpi:first-child { background: linear-gradient(135deg, #0F5E57, #0B3B37); color: #fff; border: 0 } .o2 .kpi:first-child small { color: #A9D6CF } .o2 .kpi small { color: #6B6F85 }
.o2 table { background: #fff; border: 1px solid #E3E6EE; box-shadow: 0 6px 16px rgba(16,19,31,.05) } .o2 th { background: #F7F8FB; color: #4B5068; border-bottom: 1px solid #E3E6EE } .o2 td { border-top: 1px solid #F0F1F5 }
.o2 .bar { background: #EEF0F5 } .o2 .bar span { background: linear-gradient(90deg, #0F766E, #14A08F) } .o2 .bar span.hi { background: linear-gradient(90deg, #9F1239, #E11D48) }
.o2 .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
.o2 .c-d { background: #FBEFF2; color: #A1173D } .o2 .c-w { background: #FBF3E6; color: #93570B } .o2 .c-c { background: #F7F4E4; color: #6F5D12 } .o2 .c-ok { background: #EAF5F1; color: #0F6B5E }
.o2 .btn { color: #0F5E57; border-color: #BFDDD8; background: #F2FAF8 }

/* ===== 3：白黒＋色は点だけ（静かで上品） ===== */
.o3 { background: #FCFCFD }
.o3 > header { background: #fff; border-bottom: 1px solid #ECECF0; color: #6B6F85 } .o3 > header b { color: #111 }
.o3 .side { background: #F7F7F9; border-right: 1px solid #ECECF0; color: #3F4254 }
.o3 .side a.on { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px #ECECF0; color: #111 }
.o3 .side .g i { background: #111; border-radius: 50% }
.o3 .title { color: #111 }
.o3 .kpi { background: #fff; border: 1px solid #ECECF0 } .o3 .kpi small { color: #7A7D8C }
.o3 table { background: #fff; border: 1px solid #ECECF0 } .o3 th { color: #7A7D8C; border-bottom: 1px solid #ECECF0; font-weight: 500 } .o3 td { border-top: 1px solid #F3F3F6 }
.o3 .bar { background: #F0F0F3; height: 6px } .o3 .bar span { background: #2A2D3A } .o3 .bar span.hi { background: #C2263F }
.o3 .chip { background: none; color: #2A2D3A; font-weight: 600; padding-left: 0 } .o3 .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50% }
.o3 .c-d::before { background: #C2263F } .o3 .c-w::before { background: #D97706 } .o3 .c-c::before { background: #CA9A04 } .o3 .c-ok::before { background: #16A34A }
.o3 .btn { color: #111; border-color: #DEDEE5; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.05) }

.now { background: #F5F6FA } .now > header { background: #fff; color: #6B6F85; border-bottom: 1px solid #E8E9F0 } .now > header b { color: #171717 }
.now .side { background: #191B2E; color: #C9CBE0 } .now .side a.on { background: rgba(255,255,255,.08); color: #fff } .now .side .g i { background: #0E9384 }
.now .kpi { background: #fff; border: 1px solid #E8E9F0 } .now .kpi small { color: #6B6F85 }
.now table { background: #fff; border: 1px solid #E8E9F0 } .now th { background: #E6F6F3; color: #0B6B60 } .now td { border-top: 1px solid #F0F1F5 }
.now .bar { background: #F0F1F5 } .now .bar span { background: #EA8A00 } .now .bar span.hi { background: #E11D48 }
.now .c-d { background: #FFE4E9; color: #BE123C } .now .c-w { background: #FFF4E0; color: #8A4B00 } .now .c-c { background: #FFF8D6; color: #6B5300 } .now .c-ok { background: #E9F7EE; color: #116B34 }
.now .btn { color: #0B6B60; border-color: #B8E3DC }
@media (max-width: 760px) { .app { grid-template-columns: 1fr } .side { display: none } .kpis { grid-template-columns: repeat(2, 1fr) } table { font-size: 12px } .bar { width: 80px } }
</style></head>
<body><div class="wrap">
<div><h1>色の見本：どれがいいですか？</h1><div class="lead">同じ「残業・36協定」の画面を3通りで塗りました。いちばん下は今の色です。番号で選んでください（混ぜるのもありです）。</div></div>
<div id="list"></div>
</div>
<script>
const opts = [
  ['o1', '1', '墨と金', '紺に近い墨色の土台に、くすんだ金を差し色に。札はベタ塗りをやめて細い線で囲む。落ち着いた高級感'],
  ['o2', '2', '深い宝石色', '分類ごとの色は残して、1段深く・彩度を落とす。大事な数字のカードだけ深い色のグラデーション。札は色の点＋淡い面'],
  ['o3', '3', '白黒＋色は点だけ', '画面はほぼ白黒。色は状態を示す小さな点と、危ない棒だけに使う。静かで上品（分類の色はメニューの印だけに残る）'],
  ['now', '今', 'いまの色', '比べる用。パステルの札と、明るいオレンジ・緑の棒'],
];
const rows = [['佐藤 光', 'H社（渋谷）', 36, 50, '上限間近', 'd', true], ['伊藤 誠', 'C社（新宿）', 35, 48, '警告', 'w', true], ['鈴木 一郎', 'D社（大手町）', 27, 37, '注意', 'c'], ['渡辺 涼', 'F社（横浜）', 22, 30, '問題なし', 'ok']];
const html = opts.map(([cls, no, name, desc]) => `
<section class="opt ${cls}"><header><b>${no === '今' ? '' : no + '．'}${name}</b><span>${desc}</span></header>
<div class="app"><nav class="side"><div class="g"><i></i>労務/営業管理</div><a>当日の出勤状況</a><a>申請の承認</a><a class="on">残業・36協定・有給</a><a>勤怠の締め</a><a>現場・契約</a><div class="g"><i style="opacity:.6"></i>営業</div><a>案件進捗</a><a>要員リスト</a></nav>
<div class="main"><div class="title">残業・36協定・有給</div>
<div class="kpis"><div class="kpi"><small>協定の上限（月）</small><b>45h</b></div><div class="kpi"><small>特別条項（月）</small><b>90h</b></div><div class="kpi"><small>45h を超えそう</small><b>2人</b></div><div class="kpi"><small>上限間近</small><b>1人</b></div></div>
<table><thead><tr><th>社員</th><th>今月（実績→見込み）</th><th>45h超え</th><th>段階</th><th></th></tr></thead><tbody>
${rows.map(([n, s, a, p, l, k, hi]) => `<tr><td><b>${n}</b><div style="font-size:11.5px;opacity:.6">${s}</div></td><td><span class="bar"><span class="${hi ? 'hi' : ''}" style="width:${p}%;opacity:.3"></span><span class="${hi ? 'hi' : ''}" style="width:${a}%"></span></span><b>${a}h</b> → ${p}h</td><td>${k === 'd' ? 6 : k === 'w' ? 4 : 1}／6回</td><td><span class="chip c-${k}">${l}</span></td><td style="text-align:right">${k === 'ok' ? '—' : '<button class="btn">知らせる</button>'}</td></tr>`).join('')}
</tbody></table></div></div></section>`).join('');
document.getElementById('list').innerHTML = html;
</script>
</body></html>
